html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #48426e;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Tiny Trails loading page (tools/web_page.gd): the splash colour from the first byte, the loading screen at once, the progress bar in the loading image's bottom band. */
body {
	background-color: #48426e;
}

#status {
	visibility: visible;
	container-type: size;
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	box-sizing: border-box;
	border: solid #1e1b46;
	border-radius: 9999px;
	background: rgba(255, 249, 238, 0.250);
	color: #9ee6cf;
	box-shadow: none;
	overflow: hidden;
	width: calc(min(100vw, 100vh * 1.6000) * 0.300);
	height: max(8px, calc(min(100vh, 100vw * 0.6250) * 0.015));
	border-width: max(2px, calc(min(100vh, 100vw * 0.6250) * 0.0025));
	border-width: max(2px, round(calc(min(100vh, 100vw * 0.6250) * 0.0025), 1px));
	bottom: max(calc((100vh - min(100vh, 100vw * 0.6250)) / 2 + min(100vh, 100vw * 0.6250) * 0.0400 - max(8px, calc(min(100vh, 100vw * 0.6250) * 0.015)) / 2), env(safe-area-inset-bottom, 0px));
	width: calc(min(100cqw, 100cqh * 1.6000) * 0.300);
	height: max(8px, calc(min(100cqh, 100cqw * 0.6250) * 0.015));
	border-width: max(2px, calc(min(100cqh, 100cqw * 0.6250) * 0.0025));
	border-width: max(2px, round(calc(min(100cqh, 100cqw * 0.6250) * 0.0025), 1px));
	bottom: max(calc((100cqh - min(100cqh, 100cqw * 0.6250)) / 2 + min(100cqh, 100cqw * 0.6250) * 0.0400 - max(8px, calc(min(100cqh, 100cqw * 0.6250) * 0.015)) / 2), env(safe-area-inset-bottom, 0px));
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	background: #9ee6cf;
	border-radius: 9999px;
}

#status-progress::-moz-progress-bar {
	background: #9ee6cf;
	border-radius: 9999px;
}

#status-progress:indeterminate::-webkit-progress-value {
	background: transparent;
}

#status-progress:indeterminate::-moz-progress-bar {
	background: transparent;
}
</style>

			<progress id="status-progress"></progress>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1345108,"index.wasm":15264601},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
